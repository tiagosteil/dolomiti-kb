# Banco: Oracle AI Database Free 26ai (ADR 0001).
# Mesmo arquivo no dev e na produção (ADR 0003); a diferença fica só no .env.
# Na produção roda na VM banco; no dev, na mesma VM do compose da aplicação.
name: dolomiti-banco

services:
  banco:
    image: container-registry.oracle.com/database/free:23.26.3.0
    container_name: dolomiti-banco
    restart: unless-stopped
    env_file: .env                       # ORACLE_PWD (senha do SYS); não versionado
    environment:
      TZ: America/Sao_Paulo              # o contêiner vem em UTC (lição de 2026-11-05)
      ENABLE_ARCHIVELOG: "true"          # sem archive log não há recuperação até um ponto no tempo
    ports:
      # Só no IP privado da VM, nunca em todas as interfaces: o Docker passa por
      # fora do iptables (lição de 2026-09-30). O NSG libera a 1521 só para a VM
      # de aplicação (ADR 0011). No dev, o acesso é por túnel SSH.
      - "${IP_PRIVADO}:1521:1521"
    extra_hosts:
      # O banco chama o proxy por estes nomes; o nginx da VM de aplicação atende
      # na porta 3000 (ADR 0004, lição de 2026-11-05 sobre localhost no contêiner).
      - "apisicredi.localhost:${IP_APLICACAO}"
      - "apisicoob.localhost:${IP_APLICACAO}"
      - "apisicoobauth.localhost:${IP_APLICACAO}"
    volumes:
      # Na produção, block volume montado em /opt/oracle/oradata. Dono 54321:54321.
      - /opt/oracle/oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
